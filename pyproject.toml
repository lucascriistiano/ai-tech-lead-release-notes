[project]
name = "ai-tech-lead-release-notes"
version = "0.1.0"
description = "Multi-agent release notes generator with FastAPI and LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.129.0",
  "uvicorn[standard]==0.40.0",
  "pydantic==2.12.5",
  "pydantic-settings==2.12.0",
  "langgraph==1.0.8",
  "langchain==1.2.10",
  "langchain-openai==1.0.3",
  "python-dotenv==1.2.1",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
