    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .donut-chart {
            width: 150px;
            height: 150px;
            background: conic-gradient(#10b981 0% 52%, #f43f5e 52% 100%);
            border-radius: 50%;
            position: relative;
        }

        .donut-chart::before {
            content: '';
            width: 100px;
            height: 100px;
            background-color: #0f172a;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background-color: #334155;
            border-radius: 4px;
        }
    </style>
</head>
